jenkins:
  systemMessage: "Jenkins Carparts — configurado por código (JCasC)"
  numExecutors: 0                 # nada roda no controller
  nodes:
    - permanent:
        name: "linux-agent"
        remoteFS: "/opt/jenkins-agent"
        numExecutors: 2
        labelString: "linux docker azure-cli"
        launcher:
          inbound:
            webSocket: true
    - permanent:
        name: "windows-agent"
        remoteFS: "C:/Users/Aluno/jenkins-agent"
        numExecutors: 1
        labelString: "windows"
        launcher:
          inbound:
            webSocket: true
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${ADMIN_PASSWORD}"
  authorizationStrategy:
    globalMatrix:
      permissions:
        - "Overall/Administer:admin"
        - "Overall/Read:authenticated"   # anonymous não tem nenhuma permissão
unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8080/}"
